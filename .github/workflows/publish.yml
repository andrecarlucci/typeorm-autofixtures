name: Publish to npm

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish if new version
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view typeorm-autofixtures@$LOCAL version || true)
          if [ "$REMOTE" = "$LOCAL" ]; then
            echo "$LOCAL already published, skipping"
          else
            npm publish --provenance --access public
          fi
